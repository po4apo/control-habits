# После мержа PR в main: Actions → «Выпуск тега (ручной)» → Run workflow.
# Создаётся аннотированный тег на текущем коммите main и пушится в origin;
# workflow build-push.yml подхватывает тег v* и публикует образы в ghcr.io.

name: Выпуск тега (ручной)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v0.2.0), должен начинаться с v — как в build-push"
        required: true
        type: string

concurrency:
  group: manual-release-tag
  cancel-in-progress: false

jobs:
  push-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Проверка формата тега
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" || "$TAG" != v* ]]; then
            echo "::error::Тег должен быть непустым и начинаться с v (например v0.2.0)"
            exit 1
          fi

      - name: Тег не должен существовать на remote
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Тег $TAG уже существует в репозитории"
            exit 1
          fi

      - name: Создать и отправить тег
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
